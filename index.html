<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Day-Date Clock</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#ded5c7;color:#4b3930;font-family:Georgia,serif}
body{display:table}.stage{display:table-cell;vertical-align:middle;text-align:center;padding:18px}
.clock{position:relative;box-sizing:border-box;width:96%;max-width:940px;margin:auto;padding:22px 24px 20px;border-radius:34px;background:linear-gradient(#514039,#211b19 20%,#302622 82%,#171312);border:4px solid #171312;box-shadow:0 18px 28px #30201655}
.clock.ivory{background:linear-gradient(#faf7f1,#ded8cf 18%,#f1ede6 82%,#c8c0b5);border-color:#b9b0a6}
.knobs{height:16px;position:absolute;top:-16px;left:0;right:0;display:flex;justify-content:space-around;padding:0 12%}
.knob{width:36px;height:22px;border-radius:8px 8px 2px 2px;background:linear-gradient(90deg,#191615,#62534b,#211b19);border:2px solid #171312}
.ivory .knob{background:linear-gradient(90deg,#c8c1b8,#fff,#b6ada2);border-color:#aaa197}
.bezel{padding:12px;border-radius:20px;background:linear-gradient(145deg,#d9d1c8,#f7f2eb 28%,#c5bcb2);box-shadow:inset 0 2px 5px #0004}
.panel{min-height:260px;border-radius:12px;border:2px solid #bcb3a9;background:linear-gradient(135deg,#f5f0e9,#e9e2d9);display:flex;align-items:stretch;padding:13px;box-sizing:border-box;gap:14px}
.left{flex:1.55;display:flex;flex-direction:column;min-width:0;border:1px solid #c8beb4;border-radius:12px;padding:10px;box-sizing:border-box}
.labels{display:flex;justify-content:space-around;font:18px Arial,sans-serif;letter-spacing:2px;color:#66574d;margin:0 0 8px}
.windows{display:flex;gap:12px;flex:1}
.window{flex:1;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(90deg,#d4ccc3,#f7f3ed 14%,#eee8e0 85%,#c9c0b7);border:2px solid #c2b9af;border-radius:9px;box-shadow:inset 0 2px 7px #0002}
.window:before{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px solid #5a483022}
.window span{font:bold 72px Arial,sans-serif;color:#65564d;letter-spacing:-3px;text-shadow:0 1px #fff;z-index:1}
#day{font-size:54px;letter-spacing:-2px}
.analog-wrap{width:31%;min-width:190px;display:flex;align-items:center;justify-content:center}
.analog{position:relative;width:100%;max-width:250px;aspect-ratio:1/1;border-radius:16px;background:linear-gradient(145deg,#faf7f1,#e7e0d7);border:2px solid #bdb4aa}
.tick{position:absolute;width:7px;height:7px;background:#44362f;border-radius:1px;transform:translate(-50%,-50%)}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:8px}
.hour{width:7px;height:25%;background:#39302c;margin-left:-3.5px}
.minute{width:4px;height:36%;background:#39302c;margin-left:-2px}
.second{width:2px;height:39%;background:#b74d35;margin-left:-1px}
.hub{position:absolute;width:14px;height:14px;background:#c45b3c;border:2px solid #8e3928;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5}
.weather{margin-top:12px;display:flex;justify-content:space-between;align-items:center;font:13px Arial,sans-serif;color:#76675d;letter-spacing:1px;padding:0 7px}
.weather strong{color:#59483e;font-size:16px;letter-spacing:0}
.status{margin-top:12px;font:12px Arial,sans-serif;color:#76675d}
.controls{margin:15px auto 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button,input{font:14px Arial,sans-serif;border:1px solid #9b897b;border-radius:7px;padding:9px 12px;background:#f5efe7;color:#4b3930}
@media(max-width:600px){.clock{padding:15px 12px;border-radius:24px}.bezel{padding:7px}.panel{min-height:190px;padding:7px;gap:7px}.left{padding:6px}.analog-wrap{min-width:110px}.window span{font-size:42px}#day{font-size:30px}.labels{font-size:13px}.weather{font-size:10px}}
</style></head><body><div class="stage">
<div class="clock" id="case"><div class="knobs"><i class="knob"></i><i class="knob"></i><i class="knob"></i></div>
<div class="bezel"><div class="panel"><div class="left"><div class="labels"><span>DAY</span><span>DATE</span></div>
<div class="windows"><div class="window"><span id="day">TUE</span></div><div class="window"><span id="date">17</span></div></div></div>
<div class="analog-wrap"><div class="analog" id="dial"><div class="hand hour" id="hour"></div><div class="hand minute" id="minute"></div><div class="hand second" id="second"></div><div class="hub"></div></div></div>
</div><div class="weather"><span id="place">LOCAL WEATHER</span><strong id="weather">Weather not loaded</strong><span id="range"></span></div></div></div>
<div class="status" id="status">RETRO DAY-DATE CLOCK · WEATHER REQUIRES WI-FI</div>
<div class="controls"><button onclick="toggleCase()">Switch dark / ivory case</button><input id="city" value="West Jordan" aria-label="City"><button onclick="loadWeather()">Update weather</button></div>
</div>
<script>
(function(){
var days=["SUN","MON","TUE","WED","THU","FRI","SAT"],dial=document.getElementById("dial");
for(var i=0;i<12;i++){var t=document.createElement("div"),a=(i*30-90)*Math.PI/180;t.className="tick";t.style.left=(50+43*Math.cos(a))+"%";t.style.top=(50+43*Math.sin(a))+"%";dial.appendChild(t);}
function tick(){var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();document.getElementById("day").innerHTML=days[d.getDay()];document.getElementById("date").innerHTML=d.getDate();document.getElementById("hour").style.transform="rotate("+((h%12)*30+m*.5)+"deg)";document.getElementById("minute").style.transform="rotate("+(m*6+s*.1)+"deg)";document.getElementById("second").style.transform="rotate("+(s*6)+"deg)";}
tick();setInterval(tick,1000);
window.toggleCase=function(){var c=document.getElementById("case");c.className=c.className.indexOf("ivory")>=0?"clock":"clock ivory";};
window.loadWeather=function(){var city=document.getElementById("city").value,x=new XMLHttpRequest();document.getElementById("status").innerHTML="LOOKING UP WEATHER…";x.onreadystatechange=function(){if(x.readyState===4){try{var g=JSON.parse(x.responseText),p=g.results[0],y=new XMLHttpRequest();y.onreadystatechange=function(){if(y.readyState===4){try{var w=JSON.parse(y.responseText),c=w.current_weather,code=c.weathercode,desc=code===0?"Clear":(code<3?"Partly cloudy":(code===3?"Overcast":(code<50?"Fog":(code<70?"Rain":(code<80?"Snow":(code<90?"Showers":"Thunderstorms"))))));document.getElementById("place").innerHTML=p.name.toUpperCase();document.getElementById("weather").innerHTML=Math.round(c.temperature)+"° · "+desc;document.getElementById("status").innerHTML="WEATHER UPDATED";}catch(e){document.getElementById("status").innerHTML="WEATHER DATA UNAVAILABLE";}}};y.open("GET","https://api.open-meteo.com/v1/forecast?latitude="+p.latitude+"&longitude="+p.longitude+"&current_weather=true",true);y.send();}catch(e){document.getElementById("status").innerHTML="CITY NOT FOUND OR WEATHER UNAVAILABLE";}}};x.open("GET","https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(city)+"&count=1&language=en&format=json",true);x.send();};
})();
</script></body></html>
